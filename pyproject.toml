[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strandline"
version = "0.2.0"
description = "Strandline: AI agents that investigate failed Nextflow runs on AWS Batch / HealthOmics through the AWS SDK, trace the pipeline config, and open the fix as a PR/MR."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=8"]

[project.scripts]
strandline = "strandline.cli:main"
pipefix = "strandline.cli:main"      # the old name, kept for a while

[tool.setuptools.packages.find]
include = ["strandline*"]

[tool.setuptools.package-data]
strandline = ["ui/static/*", "ui/static/fonts/*", "demo/pipeline/**/*", "demo/pipeline/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
