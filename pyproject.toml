[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipefix"
version = "0.2.0"
description = "Investigate failed Nextflow runs on AWS Batch / HealthOmics through the AWS SDK, trace the pipeline config, and open the fix as a PR/MR."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=8"]

[project.scripts]
pipefix = "pipefix.cli:main"

[tool.setuptools.packages.find]
include = ["pipefix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
